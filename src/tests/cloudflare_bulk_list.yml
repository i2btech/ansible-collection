- name: "Cloudflare Bulk Redirects Module"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false

  vars_files:
    - vars/cloudflare.yml

  tasks:

    - name: Agregar redirecciones desde CSV
      i2btech.ops.cloudflare_bulk_redirects:
        cloudflare_account: "{{ cloudflare_account }}"
        cloudflare_api_token: "{{ cloudflare_api_token }}"
        cloudflare_list_id: "{{ cloudflare_list_id }}"
        google_drive_folder_id: "{{ google_drive_folder_id }}"
        google_impersonated_user: "{{ google_impersonated_user }}"
        cloudflare_filename: "redirects.csv"
      tags: add

    - name: Agregar redirecciones desde CSV con force_bulk=True
      i2btech.ops.cloudflare_bulk_redirects:
        cloudflare_account: "{{ cloudflare_account }}"
        cloudflare_api_token: "{{ cloudflare_api_token }}"
        cloudflare_list_id: "{{ cloudflare_list_id }}"
        google_drive_folder_id: "{{ google_drive_folder_id }}"
        google_impersonated_user: "{{ google_impersonated_user }}"
        cloudflare_filename: "redirects.csv"
        force_bulk: true
      tags: add-force

    - name: Forzar actualización con replace_existing=True
      i2btech.ops.cloudflare_bulk_redirects:
        cloudflare_account: "{{ cloudflare_account }}"
        cloudflare_api_token: "{{ cloudflare_api_token }}"
        cloudflare_list_id: "{{ cloudflare_list_id }}"
        google_drive_folder_id: "{{ google_drive_folder_id }}"
        google_impersonated_user: "{{ google_impersonated_user }}"
        cloudflare_filename: "redirects.csv"
        replace_existing: true
      tags: replace

    - name: Probar fallo controlado cuando el archivo no existe
      i2btech.ops.cloudflare_bulk_redirects:
        cloudflare_account: "{{ cloudflare_account }}"
        cloudflare_api_token: "{{ cloudflare_api_token }}"
        cloudflare_list_id: "{{ cloudflare_list_id }}"
        cloudflare_filename: "archivo_inexistente.csv"
      tags: fail
